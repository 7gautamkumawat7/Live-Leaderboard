services:
  redis:
    image: redis:7-alpine
    container_name: liveleaderboard-redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: liveleaderboard-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "@56aK1234"
      POSTGRES_DB: leaderboard_db
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  redis-data:
  pg-data:
